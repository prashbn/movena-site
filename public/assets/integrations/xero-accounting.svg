<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Xero accounting dashboard illustration</title>
  <desc id="desc">A ledger card, bar chart and totals arranged on a pale blue background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eafaff"/>
      <stop offset="1" stop-color="#c9f1fb"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".98"/>
      <stop offset="1" stop-color="#f8fdff" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="576" cy="56" r="106" fill="#13b5ea" opacity=".09"/>
  <circle cx="82" cy="330" r="116" fill="#ffffff" opacity=".44"/>
  <g transform="translate(55 43)">
    <rect width="530" height="274" rx="24" fill="url(#card)" stroke="#84d9ee" stroke-opacity=".65"/>
    <rect x="26" y="25" width="76" height="30" rx="15" fill="#13b5ea"/>
    <text x="64" y="46" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8">XERO</text>
    <text x="26" y="94" fill="#315864" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cash flow</text>
    <text x="26" y="130" fill="#153c48" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">$48,620</text>
    <text x="26" y="153" fill="#658b95" font-family="Arial, Helvetica, sans-serif" font-size="12">Current month</text>
    <g transform="translate(26 181)">
      <rect width="282" height="64" rx="14" fill="#e9f8fc"/>
      <path d="M20 42C48 40 59 23 84 29c20 5 31 16 52 5 20-11 35-31 57-22 20 8 32 32 67 9" fill="none" stroke="#13b5ea" stroke-width="5" stroke-linecap="round"/>
      <circle cx="260" cy="21" r="5" fill="#13b5ea"/>
    </g>
    <g transform="translate(347 79)">
      <rect width="157" height="166" rx="18" fill="#ecf9fc"/>
      <text x="19" y="31" fill="#527a85" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Revenue</text>
      <g transform="translate(20 55)" fill="#13b5ea">
        <rect width="18" height="72" rx="9" opacity=".28"/>
        <rect x="30" y="35" width="18" height="37" rx="9" opacity=".45"/>
        <rect x="60" y="17" width="18" height="55" rx="9" opacity=".65"/>
        <rect x="90" y="2" width="18" height="70" rx="9"/>
      </g>
      <rect x="20" y="142" width="86" height="7" rx="3.5" fill="#b3dce6"/>
    </g>
  </g>
</svg>
