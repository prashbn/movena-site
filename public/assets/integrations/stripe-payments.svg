<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Stripe payments and billing illustration</title>
  <desc id="desc">Payment cards, a completed charge and revenue bars on a soft violet background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#dedaff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#635bff"/>
      <stop offset="1" stop-color="#7a73ff"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="592" cy="317" r="136" fill="#635bff" opacity=".08"/>
  <g transform="translate(50 39)">
    <rect width="540" height="282" rx="27" fill="#fff" fill-opacity=".8" stroke="#c6c1fa"/>
    <rect x="26" y="24" width="80" height="30" rx="15" fill="#635bff"/>
    <text x="66" y="44" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6">STRIPE</text>
    <g transform="translate(30 78)">
      <rect x="18" y="10" width="262" height="155" rx="22" fill="#b9b4ff" transform="rotate(-4 149 87)"/>
      <rect width="262" height="155" rx="22" fill="url(#card)"/>
      <rect y="31" width="262" height="31" fill="#302997" opacity=".7"/>
      <rect x="23" y="85" width="49" height="32" rx="7" fill="#f8d57e"/>
      <rect x="91" y="91" width="97" height="7" rx="3.5" fill="#fff" opacity=".7"/>
      <rect x="91" y="106" width="63" height="7" rx="3.5" fill="#fff" opacity=".42"/>
      <text x="224" y="137" text-anchor="end" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">•••• 2048</text>
    </g>
    <g transform="translate(331 75)">
      <rect width="178" height="87" rx="18" fill="#f0efff"/>
      <circle cx="32" cy="31" r="16" fill="#635bff"/>
      <path d="M25 31l5 5 10-12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="59" y="29" fill="#5f5a7e" font-family="Arial, Helvetica, sans-serif" font-size="11">PAYMENT</text>
      <text x="59" y="49" fill="#25213c" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Completed</text>
      <rect x="20" y="68" width="126" height="6" rx="3" fill="#b9b4ff"/>
      <rect y="105" width="178" height="102" rx="18" fill="#f0efff"/>
      <text x="18" y="132" fill="#5f5a7e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">REVENUE</text>
      <g transform="translate(19 148)" fill="#635bff">
        <rect width="21" height="38" rx="6" opacity=".25"/>
        <rect x="32" y="18" width="21" height="20" rx="6" opacity=".42"/>
        <rect x="64" y="8" width="21" height="30" rx="6" opacity=".65"/>
        <rect x="96" width="21" height="38" rx="6"/>
        <rect x="128" y="13" width="21" height="25" rx="6" opacity=".78"/>
      </g>
    </g>
  </g>
</svg>
